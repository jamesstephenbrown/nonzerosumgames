<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NEUTROPIA</title>

<!-- viewport-fit=cover lets the canvas run under the notch; user-scalable=no stops a
     double-tap in the game zooming the page instead of doing what you meant -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<!-- THE line that matters for iOS. With this, Add to Home Screen launches with no Safari
     chrome at all - no address bar, no toolbar - which is the whole "acts like an app" effect.
     Android reads display:standalone from the manifest instead. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEUTROPIA">
<meta name="theme-color" content="#336699">

<!-- THE LANDING PAGE'S MANIFEST, not this folder's own. One app, whichever page it is installed from:
     this page's own manifest made a second, different app - its own start page and scope, and locked to
     landscape - for anyone who installed from here, having arrived by a link straight to the game. The
     site has play/ inside neutropia/, so ../ is the landing page's; served on its own (the local test
     build) ../ is this folder, and its copy is used. -->
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
  /* The game's own face, shipped rather than hoped for - it is a custom font, so no machine has it.
     Helvetica Rounded and SF Rounded (ui-rounded) are the fallbacks while it loads or if it fails.
     font-display:swap so text is never invisible waiting on it. */
  @font-face {
    font-family: "Double Bubble";
    src: url("DoubleBubble.otf") format("opentype");
    font-display: swap;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #336699; color: #cfe0f2;
    /* Matches the game's own lettering. Arial Rounded MT Bold ships on macOS and iOS; the others are
       the nearest rounded faces elsewhere, falling back to plain Arial rather than to something with
       a different character. */
    /* Double Bubble is a demo cut with an incomplete character set - no apostrophe, no full stop, which
       render as tofu boxes. So it is used for the title alone, where the glyphs are known, and the
       rounded system faces carry everything with real punctuation in it. */
    font-family: "Helvetica Rounded", ui-rounded, "Arial Rounded MT Bold", "Varela Round", Arial, sans-serif;
    /* stops the pull-to-refresh bounce and rubber-banding that make a game feel like a web page */
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* fixed + inset rather than width:100% - on mobile Safari a percentage height chases the
     collapsing address bar and the canvas resizes every time you touch the screen */
  #wrap { position: fixed; inset: 0; }
  canvas#unity-canvas { width: 100%; height: 100%; display: block; background: #336699; }

  /* The start screen doubles as the loading screen: the game downloads behind it while you read, so
     Play is instant rather than the usual stare-at-a-bar-then-stare-at-another. */
  #start {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px; z-index: 10;
    padding: env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
    background: #336699; transition: opacity .45s ease;
  }
  #start.done { opacity: 0; pointer-events: none; }
  #title { font-family: "Double Bubble", "Helvetica Rounded", ui-rounded, "Arial Rounded MT Bold", "Varela Round", Arial, sans-serif; font-size: clamp(34px, 10vmin, 68px); letter-spacing: .06em; font-weight: 400; color: #dcecff; margin: 0; }
  #tag { margin: -6px 0 4px; font-size: clamp(12px, 3.2vmin, 16px); font-weight: 400; opacity: .72; letter-spacing: .04em; }
  #bar { width: min(46vw, 260px); height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; }
  #fill { width: 0%; height: 100%; background: #33ffcc; transition: width .2s ease; }
  #btns { display: flex; flex-direction: column; gap: 12px; align-items: stretch; width: min(74vw, 300px); }
  #btns button {
    font: inherit; font-size: clamp(15px, 4vmin, 18px); font-weight: 600; letter-spacing: .02em;
    padding: 14px 18px; border: 0; border-radius: 14px; cursor: pointer; color: #17324d;
    background: #33ffcc; transition: transform .12s ease, opacity .2s ease;
  }
  #btns button:active { transform: scale(.97); }
  #btns button[disabled] { background: rgba(255,255,255,.2); color: #cfe0f2; cursor: default; }
  /* iOS bookmarks the page you are standing on, so the steps have to be shown HERE, on the game,
     or the icon saves the landing page instead of the game. */
  #steps { display: inline-block; text-align: left; margin: 4px 0 0; padding-left: 22px; max-width: min(80vw, 330px);
           font-size: clamp(12px, 3.4vmin, 15px); line-height: 1.75; opacity: .85; }
  #steps[hidden] { display: none; }
  #steps b { color: #33ffcc; }
  /* Reserved, not display:none - a button appearing under the thumb mid-tap is how you press the
     wrong thing. It fades in where it already sat. */
  /* Install is the primary action - it is the better way to play, so it gets the solid button and
     Play is demoted to the outline. Reserved rather than display:none so nothing moves under a thumb. */
  #btns #play { background: transparent; box-shadow: inset 0 0 0 2px rgba(220,236,255,.45); color: #dcecff; }
  #btns #play[disabled] { box-shadow: inset 0 0 0 2px rgba(220,236,255,.2); color: rgba(220,236,255,.5); }


</style>
</head>
<body>
<div id="wrap"><canvas id="unity-canvas" tabindex="-1"></canvas></div>

<div id="start">
  <h1 id="title">NEUTROPIA</h1>
  <p id="tag">happiness is contagious</p>
  <div id="bar"><div id="fill"></div></div>
  <div id="btns"><button id="play" disabled>Loading&hellip;</button></div>
  <ol id="steps" hidden></ol>
</div>


<script>
  var canvas  = document.querySelector("#unity-canvas");
  var loading = document.querySelector("#start");
  var fill    = document.querySelector("#fill");
  var playBtn = document.querySelector("#play");
  var instance = null, ready = false, started = false;

  var installed = window.matchMedia("(display-mode: standalone)").matches
               || window.matchMedia("(display-mode: fullscreen)").matches
               || navigator.standalone === true;

  // The prompt is captured but never surfaced as a button here. Arriving with ?install=1 means the
  // landing page already asked; raise it once, silently, and otherwise say nothing. The game is the
  // game - it does not hand out instructions.
  var deferredPrompt = null, wantsInstall = /[?&]install=1/.test(location.search);
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredPrompt = e;
    if (wantsInstall && !installed) {
      wantsInstall = false;
      e.prompt();
    }
  });

  // ONE STAMP PER BUILD, SO A NEW BUILD IS NEVER SERVED STALE. The three payloads have the same names
  // every time, and they are tens of megabytes, so a browser that has them will happily go on using the
  // ones it downloaded days ago - which is a change appearing not to have been made at all. The deploy
  // script rewrites 20261003060211 to the time of the build, so every deploy asks for new URLs. (The
  // service worker never caches these; it is ordinary HTTP caching that holds on to them.)
  var BUILD_STAMP = "?v=20261003060211";

  var config = {
    dataUrl:      "Build/Neutropia.data.unityweb" + BUILD_STAMP,
    frameworkUrl: "Build/Neutropia.framework.js.unityweb" + BUILD_STAMP,
    codeUrl:      "Build/Neutropia.wasm.unityweb" + BUILD_STAMP,
    streamingAssetsUrl: "StreamingAssets",
    companyName:  "BranchOutMedia",
    productName:  "NEUTROPIA",
    productVersion: "1.0",
    // Unity keeps the drawing buffer the same pixel size as the element, so the canvas is always
    // exactly the window and never letterboxed inside it.
    matchWebGLToCanvasSize: true,
    // Retina phones would otherwise render four times the pixels for no visible gain and a large
    // framerate cost. Capped at 2 rather than 1 so desktop still looks sharp.
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
  };

  // Stripping the install UI took resize() out with it, and begin() still called it - so clicking Play
  // threw before canvas.focus(), which left the canvas unfocused (no keyboard) and the drawing buffer
  // at whatever size it happened to be, drawing the arena off-centre.
  function resize () {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var r = canvas.getBoundingClientRect();
    canvas.width  = Math.round(r.width  * dpr);
    canvas.height = Math.round(r.height * dpr);
  }
  addEventListener("resize", resize);
  // iOS still reports the pre-rotation size for a frame or two after the address bar settles.
  addEventListener("orientationchange", function () { setTimeout(resize, 250); });

  function begin () {
    loading.classList.add("done");
    resize();
    canvas.focus();
  }

  var ua = navigator.userAgent;
  var iOS = /iPad|iPhone|iPod/.test(ua) || (/Macintosh\b/.test(ua) && navigator.maxTouchPoints > 1);
  if (iOS && wantsInstall && !installed) {
    var steps = document.querySelector("#steps");
    steps.innerHTML = ["Tap <b>&#8943;</b> at the bottom right of Safari.",
                       "Tap <b>Share</b>.",
                       "Scroll down to <b>Add to Home Screen</b>.",
                       "Tap <b>Add</b>, then open it from the new icon."]
                      .map(function (t) { return "<li>" + t + "</li>"; }).join("");
    steps.hidden = false;
  }

  // FULL SCREEN IN A PHONE'S BROWSER, not only when installed. Android's browsers can hide their own
  // bars for a page - iOS cannot, and installed copies are full screen already - so a phone or tablet
  // playing in a browser tab goes full screen on Play, which needs the tap to be allowed at all. Leaving
  // it (Back) just leaves it; the game carries on in the tab.
  function fullScreen () {
    var root = document.documentElement;
    var coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    if (installed || iOS || !coarse || document.fullscreenElement || !root.requestFullscreen) { return; }
    try {
      var asked = root.requestFullscreen({ navigationUI: "hide" });
      if (asked && asked.catch) { asked.catch(function () {}); }
    } catch (e) { /* refused: play on in the tab */ }
  }
  document.addEventListener("fullscreenchange", function () { setTimeout(resize, 100); });

  playBtn.addEventListener("click", function () {
    started = true;
    fullScreen ();
    if (ready) { begin(); } else { playBtn.textContent = "Loading\u2026"; }
  });

  // THE SITE'S SERVICE WORKER, registered here as well as by the landing page. A browser will only
  // install a page as an app when a worker looks after it, and someone sent a link straight to the game
  // never loads the landing page that registers it - so on Android they could only make a shortcut,
  // which opens in the browser, bar and all. The same worker and scope, so it is one worker, not two.
  // Only where the site's layout is (play/ inside neutropia/); the local test build has no ../sw.js.
  if ("serviceWorker" in navigator && /\/play\//.test(location.pathname)) {
    navigator.serviceWorker.register("../sw.js", { scope: "../", updateViaCache: "none" }).catch(function () {});
  }

  // UPDATES (30 Sep). Every deploy leaves version.txt beside this page holding that build's stamp - the
  // same one that is on the build's URLs above - so when the server's is newer than this page's own, a
  // newer build is up. The game shows it (Settings, through NeutropiaUpdate.jslib) and a tap loads it.
  // Looked for when the page opens, whenever it comes back to the front - an installed copy on a phone
  // can sit in the background for days without ever loading again - every half hour, and when asked.
  // nzUpdate: -1 cannot tell (an unstamped local build), 0 looking, 1 this is the latest, 2 a newer one is
  // up, 3 the look did not get through. Once a newer one has been seen it stays seen.
  var RUNNING = BUILD_STAMP.slice(3);
  window.nzUpdate = /^\d{14}$/.test(RUNNING) ? 0 : -1;
  window.nzCheckUpdate = function () {
    if (window.nzUpdate === -1) { return; }
    if (window.nzUpdate !== 2) { window.nzUpdate = 0; }
    // Past the browser's cache, and the same address every time, so the service worker keeps one copy.
    fetch("version.txt", { cache: "no-store" })
      .then(function (r) { if (!r.ok) { throw r.status; } return r.text(); })
      .then(function (t) {
        var latest = t.trim();
        if (/^\d{14}$/.test(latest) && latest > RUNNING) { window.nzUpdate = 2; }
        else if (window.nzUpdate !== 2) { window.nzUpdate = 1; }
      })
      .catch(function () { if (window.nzUpdate !== 2) { window.nzUpdate = 3; } });
  };
  // The page is fetched fresh first, so the reload cannot be answered with the copy already held - which
  // would be this build again. Progress is not touched: it lives in the site's storage, not in the build.
  window.nzApplyUpdate = function () {
    fetch(location.href.split("#")[0], { cache: "reload" }).catch(function () {}).then(function () { location.reload(); });
  };
  nzCheckUpdate();
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { nzCheckUpdate(); } });
  setInterval(function () { if (!document.hidden) { nzCheckUpdate(); } }, 30 * 60 * 1000);

  // KEEP WHAT HAS BEEN WON. Progress lives in this browser's storage for the site (PlayerPrefs, kept in
  // IndexedDB), and a browser short of space may clear a site's storage to make room. Asking to keep it
  // is silent in Chrome and Safari, which decide for themselves; Firefox would put up a question in the
  // player's face, so it is not asked there.
  if (navigator.storage && navigator.storage.persist && !/Firefox\//.test(ua)) {
    navigator.storage.persisted()
      .then(function (kept) { if (!kept) { return navigator.storage.persist(); } })
      .catch(function () {});
  }

  // ?fps=1 SHOWS THE FRAME RATE, for finding out how a phone nobody here has actually plays. Counted off
  // the browser's own frames, which the game draws on, averaged over each half second.
  if (/[?&]fps=1/.test(location.search)) {
    var meter = document.createElement("div");
    meter.style.cssText = "position:fixed;left:8px;top:8px;z-index:20;padding:3px 8px;border-radius:8px;" +
      "background:rgba(0,0,0,.45);color:#fff;font:600 13px/1.3 ui-monospace,monospace;pointer-events:none";
    document.body.appendChild(meter);
    var frames = 0, since = performance.now();
    (function tick (now) {
      frames++;
      if (now - since >= 500) {
        meter.textContent = Math.round(frames * 1000 / (now - since)) + " fps";
        frames = 0; since = now;
      }
      requestAnimationFrame(tick);
    })(since);
  }

  var script = document.createElement("script");
  script.src = "Build/Neutropia.loader.js" + BUILD_STAMP;
  script.onload = function () {
    createUnityInstance(canvas, config, function (p) {
      fill.style.width = (100 * p) + "%";
    }).then(function (u) {
      instance = u;
      ready = true;
      playBtn.disabled = false;
      playBtn.textContent = "Play";
      if (started || installed) { begin(); }   // installed copies go straight in

    }).catch(function (err) {
      // Leaving a dead "Failed to load" button strands you with nothing to press. Most causes here are
      // transient - a dropped connection, or an installed copy whose address has moved - so offer the
      // one action that fixes those, and say plainly what to do when it does not.
      playBtn.textContent = "Retry";
      playBtn.disabled = false;
      playBtn.onclick = function () { location.reload(); };
      console.error(err);
    });
  };
  document.body.appendChild(script);

</script>
</body>
</html>
