<link rel="stylesheet" type="text/css" href="style.css">

<style>
/* ---------- the menu glyphs say their own names ----------
   A drawn glyph is only obvious once you already know what it means. Hover one
   and it lifts, and its name appears in the space that opens underneath.

   Both the lift and the name are absolutely positioned or transformed, so
   neither takes part in the layout: the row never reflows, nothing slides
   sideways, and the glyph you are reaching for cannot move out from under the
   cursor. The room below is reserved permanently rather than made on demand,
   so the page beneath never jumps either. */
.menuColumn{
  padding-bottom:30px;
  /* Nothing here may be clipped. The name sits below the glyph and slightly
     outside the bar's own box, so any ancestor quietly hiding its overflow
     shaves the ends off it — which is what the soft cut-off edges were. */
  overflow:visible;
}
#menu{ overflow:visible; }
.menuColumn a.menu-link{
  position:relative;
  display:inline-block;
  text-decoration:none;
  vertical-align:middle;
}
.menuColumn a.menu-link .mi-glyph{
  display:inline-block;
  font-family:'MoreSugarExtras';
  line-height:1;
  transition:transform .38s cubic-bezier(.25,.8,.3,1);
}
.menuColumn a.menu-link .mi-word{
  position:absolute;
  left:50%;
  top:100%;
  transform:translate(-50%,-3px);
  font-family:'MoreSugar',sans-serif;
  font-size:.74em;
  font-style:normal;
  line-height:1;
  letter-spacing:.03em;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;              /* never steals the click from the link */
  transition:opacity .34s ease,transform .38s cubic-bezier(.25,.8,.3,1);
}
/* Only where hovering is a real thing. On a phone there is nothing to hover
   away from, so the name would either never show or never leave; the title
   attribute is still there for a long press. */
@media (hover:hover){
  .menuColumn a.menu-link:hover .mi-glyph{ transform:translateY(-7px); }
  .menuColumn a.menu-link:hover .mi-word{ opacity:1; transform:translate(-50%,0); }
}
/* The same state the idle cycle borrows. Outside the hover query on purpose:
   on a phone there is no hover at all, so this is the only way those names ever
   get to introduce themselves. */
.menuColumn a.menu-link.peek .mi-glyph{ transform:translateY(-7px); }
.menuColumn a.menu-link.peek .mi-word{ opacity:1; transform:translate(-50%,0); }
@media (prefers-reduced-motion:reduce){
  .menuColumn a.menu-link .mi-glyph,
  .menuColumn a.menu-link .mi-word{transition:none}
}
/* Dark mode borrows the site's own accent rather than introducing a colour. */
.dark-mode .menuColumn a.menu-link .mi-word{ color:#d59b7b; }
</style>

    <!-- Dark-mode toggle script  -->
  <script>
    const darkModeToggle = document.getElementById('darkModeToggle');

    // Load saved preference
    if (localStorage.getItem('darkMode') === 'enabled') {
      document.body.classList.add('dark-mode');
      darkModeToggle.checked = true;
    }

    darkModeToggle.addEventListener('change', function () {
      document.body.classList.toggle('dark-mode', darkModeToggle.checked);
      localStorage.setItem('darkMode', darkModeToggle.checked ? 'enabled' : 'disabled');
    });
  </script>

  <!-- Every so often one of them introduces itself, so you find out what the
       glyphs mean without having to go looking. Kept slow and one-at-a-time —
       it should read as the menu breathing, not as something demanding to be
       clicked. It never runs while you are actually in the menu, never in a
       background tab, and not at all if you have asked for less motion. -->
  <script>
  (function () {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const menu = document.querySelector('.menuColumn');
    const links = menu ? [...menu.querySelectorAll('.menu-link')] : [];
    if (links.length < 2) return;

    const SHOWN = 2000;    // up for two seconds
    const GAP = 4000;      // down for four, then another one at random
    let timer = 0, showing = null, hovering = false;

    const hide = () => { if (showing) { showing.classList.remove('peek'); showing = null; } };
    const stop = () => { clearTimeout(timer); timer = 0; hide(); };

    function schedule(delay) {
      clearTimeout(timer);
      timer = setTimeout(step, delay);
    }
    function step() {
      // Not while they are reading it themselves, and not off-screen.
      if (hovering || document.hidden) return schedule(GAP);
      let next = showing;
      while (next === showing) next = links[Math.floor(Math.random() * links.length)];
      showing = next;
      showing.classList.add('peek');
      timer = setTimeout(() => { hide(); schedule(GAP); }, SHOWN);
    }

    /* A real hover always wins: the pointer arriving cancels whatever the
       cycle was in the middle of, so the two can never both be up at once. */
    menu.addEventListener('pointerenter', () => { hovering = true; stop(); });
    menu.addEventListener('pointerleave', () => {
      hovering = false;
      schedule(GAP);
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stop();
      else if (!hovering) schedule(GAP);
    });

    schedule(1800);                          // a beat after the page settles
  })();
  </script>
