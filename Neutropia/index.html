<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NEUTROPIA</title>

<!-- viewport-fit=cover lets the canvas run under the notch; user-scalable=no stops a
     double-tap in the game zooming the page instead of doing what you meant -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<!-- THE line that matters for iOS. With this, Add to Home Screen launches with no Safari
     chrome at all - no address bar, no toolbar - which is the whole "acts like an app" effect.
     Android reads display:standalone from the manifest instead. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEUTROPIA">
<meta name="theme-color" content="#336699">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #336699; color: #cfe0f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    /* stops the pull-to-refresh bounce and rubber-banding that make a game feel like a web page */
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* fixed + inset rather than width:100% - on mobile Safari a percentage height chases the
     collapsing address bar and the canvas resizes every time you touch the screen */
  #wrap { position: fixed; inset: 0; }
  canvas#unity-canvas { width: 100%; height: 100%; display: block; background: #336699; }

  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; z-index: 10;
    transition: opacity .4s ease;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #bar { width: min(46vw, 260px); height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; }
  #fill { width: 0%; height: 100%; background: #33ffcc; transition: width .2s ease; }
  #label { font-size: 14px; letter-spacing: .18em; text-transform: uppercase; opacity: .75; }

  /* Only shown when it can actually do something: hidden once installed to the home screen,
     since there is no browser chrome left to escape from. */
  #full {
    position: fixed; z-index: 11;
    right: calc(env(safe-area-inset-right, 0px) + 12px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    width: 40px; height: 40px; border: 0; border-radius: 10px; cursor: pointer;
    background: rgba(255,255,255,.14); color: #dcecff; font-size: 17px; line-height: 40px;
  }
  #full:hover { background: rgba(255,255,255,.24); }
  @media (display-mode: standalone) { #full { display: none; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="unity-canvas" tabindex="-1"></canvas></div>

<div id="loading">
  <div id="label">NEUTROPIA</div>
  <div id="bar"><div id="fill"></div></div>
</div>
<button id="full" title="Fullscreen" aria-label="Fullscreen">&#9974;</button>

<script>
  var canvas  = document.querySelector("#unity-canvas");
  var loading = document.querySelector("#loading");
  var fill    = document.querySelector("#fill");
  var instance = null;

  var config = {
    dataUrl:      "Build/Neutropia.data.unityweb",
    frameworkUrl: "Build/Neutropia.framework.js.unityweb",
    codeUrl:      "Build/Neutropia.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName:  "BranchOutMedia",
    productName:  "NEUTROPIA",
    productVersion: "1.0",
    // Unity keeps the drawing buffer the same pixel size as the element, so the canvas is
    // always exactly the window and never letterboxed inside it.
    matchWebGLToCanvasSize: true,
    // Retina phones would otherwise render four times the pixels for no visible gain and a
    // large framerate cost. Capped at 2 rather than 1 so desktop still looks sharp.
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
  };

  // Deliberately NOT included: Unity's stock "WebGL builds are not supported on mobile devices"
  // banner. That warning predates Unity's mobile WebGL support and is what you were seeing on
  // itch - the game runs, it just says it doesn't. This template simply never shows it.

  function resize () {
    // width/height attributes, not just CSS - the CSS box and the drawing buffer are separate
    // things, and only setting the former gives you a stretched, blurry canvas.
    var w = window.innerWidth, h = window.innerHeight;
    var r = config.devicePixelRatio;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    canvas.width = Math.floor(w * r);
    canvas.height = Math.floor(h * r);
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 120); });
  resize();

  document.querySelector("#full").addEventListener("click", function () {
    if (instance && instance.SetFullscreen) { instance.SetFullscreen(1); }
    else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
  });

  // keep gestures in the game rather than in the browser
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });

  var script = document.createElement("script");
  script.src = "Build/Neutropia.loader.js";
  script.onload = function () {
    createUnityInstance(canvas, config, function (p) {
      fill.style.width = (100 * p) + "%";
    }).then(function (u) {
      instance = u;
      loading.classList.add("done");
      resize();
      canvas.focus();
    }).catch(function (err) {
      document.querySelector("#label").textContent = "Failed to load";
      console.error(err);
    });
  };
  document.body.appendChild(script);

  // Registered only at the top level. Inside an iframe - which is exactly how itch.io embeds a
  // game - a service worker is pointless and can fail noisily, so it is skipped there.
  if ("serviceWorker" in navigator && window.self === window.top) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
