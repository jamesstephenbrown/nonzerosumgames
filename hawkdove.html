<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hawk‑Dove ESS Demo</title>

  <link rel="stylesheet" href="style.css">
  <style>
    /* --- minimal page scaffolding; put fancy rules in style.css --- */
    #simCanvas {position:fixed;inset:0;z-index:0;display:block;border:none}
    #graphCanvas{position:absolute;bottom:0;left:0;width:100%;height:200px;
                 border-top:2px; z-index:5}
    #infoPanel {position:absolute;top:0;left:0;padding:.4em;z-index:10}
    #controls  {position:absolute;top:0;right:0;padding:.4em;z-index:10}
    /* #payoffTable{border-collapse:collapse;font-family:monospace}
    #payoffTable th,#payoffTable td{border:1px solid #bbb;padding:.25em .5em;text-align:center;min-width:72px} */
    .cell{display:flex;flex-direction:column;align-items:center;gap:.2em}
    .val {width:3.5ch;text-align:center;display:inline-block}
    input[type=range]{width:68px}
  </style>
</head>
<body>

<canvas id="simCanvas"></canvas>
<canvas id="graphCanvas"></canvas>

<div id="infoPanel"></div>

<div id="controls">
  <table id="payoffTable">

    <!-- tell the browser each column’s width -->
    <colgroup>
      <col class="label">
      <col class="pay">
      <col class="pay">
    </colgroup>
  
    <thead>
      <tr><th></th><th>Hawk</th><th>Dove</th></tr>
    </thead>
  
    <tbody>
      <!-- ── row: Hawk (player) ───────────────────────────── -->
      <tr>
        <th>Hawk</th>
  
        <!-- Hawk vs Hawk -->
        <td><div class="matrix-cell">
          <span class="val" id="HH_row_val">‑3</span>
          <input type="range" id="HH_row"  min="-5" max="5" step="1" value="-3">
          <span class="val" id="HH_col_val">‑3</span>
          <input type="range" id="HH_col"  min="-5" max="5" step="1" value="-3">
        </div></td>
  
        <!-- Hawk vs Dove -->
        <td><div class="matrix-cell">
          <span class="val" id="HD_row_val">3</span>
          <input type="range" id="HD_row"  min="-5" max="5" step="1" value="3">
          <span class="val" id="HD_col_val">‑3</span>
          <input type="range" id="HD_col"  min="-5" max="5" step="1" value="-3">
        </div></td>
      </tr>
  
      <!-- ── row: Dove (player) ───────────────────────────── -->
      <tr>
        <th>Dove</th>
  
        <!-- Dove vs Hawk -->
        <td><div class="matrix-cell">
          <span class="val" id="DH_row_val">‑3</span>
          <input type="range" id="DH_row"  min="-5" max="5" step="1" value="-3">
          <span class="val" id="DH_col_val">3</span>
          <input type="range" id="DH_col"  min="-5" max="5" step="1" value="3">
        </div></td>
  
        <!-- Dove vs Dove -->
        <td><div class="matrix-cell">
          <span class="val" id="DD_row_val">1</span>
          <input type="range" id="DD_row"  min="-5" max="5" step="1" value="1">
          <span class="val" id="DD_col_val">1</span>
          <input type="range" id="DD_col"  min="-5" max="5" step="1" value="1">
        </div></td>
      </tr>
    </tbody>
  </table>
  
  <button id="go">Go!</button>
</div>

<script>
/* ------------------------------------------------ canvas sizing */
const sim = document.getElementById('simCanvas'),
      gcv = document.getElementById('graphCanvas');
function resize(){
  sim.width  = window.innerWidth;
  sim.height = window.innerHeight - gcv.height;
}
gcv.height  = 90;  resize();  addEventListener('resize',resize);
const ctx = sim.getContext('2d'), gtx = gcv.getContext('2d');

/* ------------------------------------------------ parameters */
const NUM_H=50, NUM_D=50, MAX_POP=200,
      INIT_H=10, BABY=2, BASE=1.2,
      ANG_D=.05, SPD_D=.05, WIG=0.07,
      INTER_R=20, ORBIT=0.5, SLOW=0.3, COOLDOWN=2,
      CENTER=0.0005, REV=1.5;

/* ------------------------------------------------ globals */
let birds=[], nextId=1, t=0, graph=[], nextSamp=0, maxT=30, run=false, last=performance.now();
const inf=document.getElementById('infoPanel');

/* ------------- get slider value helper & live label update --- */
const $ = id=>document.getElementById(id);
['HH','HD','DH','DD'].forEach(c=>['row','col'].forEach(r=>{
  const s=$(c+'_'+r), v=$(c+'_'+r+'_val');
  s.oninput=()=>v.textContent=s.value;
  s.oninput();                                          // init label
}));
const val=id=>parseFloat($(id).value);

/* --------------------------------------------- payoff lookup */
function payoff(a,b){
  if(a==='H'&&b==='H')return[val('HH_row'),val('HH_col')];
  if(a==='H'&&b==='D')return[val('HD_row'),val('HD_col')];
  if(a==='D'&&b==='H')return[val('DH_row'),val('DH_col')];
  return[val('DD_row'),val('DD_col')];
}

/* ------------------------------------------------ utilities */
const nrm=a=>((a+Math.PI)%(2*Math.PI))-Math.PI,
      rnd=(m,M)=>Math.random()*(M-m)+m,
      now =()=>performance.now()/1000;

/* ------------------------------------------------ Bird class */
class B{
  constructor(str){
    this.id=nextId++; this.s=str;
    this.x=rnd(0,sim.width); this.y=rnd(0,sim.height);
    this.a=rnd(0,6.28); this.ta=this.a;
    this.sp=BASE;       this.ts=this.sp;
    this.h=INIT_H;      this.age=0; this.nt=rnd(10,20);
    this.ip=false; this.p=null; this.ie=0; this.cd=new Map();
    this.ocx=this.ocy=this.or=this.oa=0; this.od=1;
  }
  upd(dt){
    this.age+=dt;
    if(this.ip){
      if(now()<this.ie){
        this.oa+=REV*this.od*dt;
        this.x=this.ocx+this.or*Math.cos(this.oa);
        this.y=this.ocy+this.or*Math.sin(this.oa);
        this.a=this.oa+this.od*Math.PI/2;
      }else fin(this);
      return;
    }
    /* wander + centre pull */
    this.ta=nrm(this.ta+(Math.random()-.5)*.02+Math.sin(this.age*4)*WIG*dt);
    const dx=sim.width/2-this.x,dy=sim.height/2-this.y,d=Math.hypot(dx,dy);
    if(d>5){const ca=Math.atan2(dy,dx);
            this.ta=nrm(this.ta+nrm(ca-this.ta)*CENTER*d);}
    this.a = nrm(this.a + nrm(this.ta-this.a)*ANG_D);
    this.sp += (BASE-this.sp)*SPD_D;
    this.x=(this.x+Math.cos(this.a)*this.sp*dt*60+sim.width)%sim.width;
    this.y=(this.y+Math.sin(this.a)*this.sp*dt*60+sim.height)%sim.height;
    if(this.h>10) this.h=10;
  }
  draw(){
    ctx.fillStyle=this.s==='H'?'#f33':'#fff';
    const sz=3+this.h;
    ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.a);
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-sz,-sz/2);ctx.lineTo(-sz,sz/2);
    ctx.closePath();ctx.fill();ctx.restore();
  }
}

/* -------------------------------- interaction helpers */
function fin(b){
  const p=b.p; if(!p||!birds.includes(b)||!birds.includes(p))return;
  [b.ip,p.ip]=[false,false]; [b.p,p.p]=[null,null];
  const [pa,pb]=payoff(b.s,p.s); b.h+=pa; p.h+=pb;
  if(b.h<=0)birds.splice(birds.indexOf(b),1);
  if(p.h<=0)birds.splice(birds.indexOf(p),1);
  const ang=Math.atan2(b.y-p.y,b.x-p.x);
  b.ta=ang; p.ta=ang+Math.PI; b.sp=p.sp=BASE;
}
function collide(A,B){
  A.ip=B.ip=true; A.p=B; B.p=A;
  const mx=(A.x+B.x)/2,my=(A.y+B.y)/2;
  A.ocx=B.ocx=mx; A.ocy=B.ocy=my;
  A.or=Math.hypot(A.x-mx,A.y-my); B.or=Math.hypot(B.x-mx,B.y-my);
  A.oa=Math.atan2(A.y-my,A.x-mx); B.oa=Math.atan2(B.y-my,B.x-mx);
  const chooseDir=(()=>{
    const ccw=Math.abs(nrm(A.oa+Math.PI/2-A.a))+Math.abs(nrm(B.oa+Math.PI/2-B.a));
    const  cw=Math.abs(nrm(A.oa-Math.PI/2-A.a))+Math.abs(nrm(B.oa-Math.PI/2-B.a));
    return ccw<=cw?1:-1})();
  A.od=B.od=chooseDir;
  A.ie=B.ie=now()+ORBIT;
  A.sp=A.ts=BASE*SLOW; B.sp=B.ts=BASE*SLOW;
}

/* -------------------------------- population */
function populate(){
  birds=[]; nextId=1;
  for(let i=0;i<NUM_H;i++)birds.push(new B('H'));
  for(let i=0;i<NUM_D;i++)birds.push(new B('D'));
}

/* -------------------------------- main loop */
function loop(){
  const nf=performance.now(),dt=(nf-last)/1000; last=nf;
  if(run){
    t+=dt;
    birds.forEach(b=>b.upd(dt));
    for(let i=0;i<birds.length;i++)for(let j=i+1;j<birds.length;j++){
      const A=birds[i],B=birds[j]; if(A.ip||B.ip)continue;
      if(now()<(A.cd.get(B.id)||0)||now()<(B.cd.get(A.id)||0))continue;
      const dx=A.x-B.x,dy=A.y-B.y;
      if(dx*dx+dy*dy<INTER_R*INTER_R){
        collide(A,B);
        A.cd.set(B.id,now()+COOLDOWN); B.cd.set(A.id,now()+COOLDOWN);
      }
    }
    birds=birds.filter(b=>b.h>0);
    birds.forEach(b=>{if(birds.length<MAX_POP&&b.h>5&&b.age>b.nt){
                        birds.push(new B(b.s)); b.nt+=rnd(10,20);} });
    if(t>nextSamp){graph.push({t,frac:birds.filter(b=>b.s==='H').length/birds.length});
                   nextSamp+=.5;if(t>maxT)maxT=t;}
    /* draw */
    ctx.clearRect(0,0,sim.width,sim.height); birds.forEach(b=>b.draw());
    inf.textContent=`Pop ${birds.length} | Hawks ${birds.filter(b=>b.s==='H').length} | Doves ${birds.filter(b=>b.s==='D').length}`;
    drawGraph();
  }
  requestAnimationFrame(loop);
}
function drawGraph(){
  gtx.clearRect(0,0,gcv.width,gcv.height);
  // gtx.fillStyle='clear';gtx.fillRect(0,0,gcv.width,gcv.height);
  gtx.beginPath();
  graph.forEach(({ t, frac }, i) => {        // <-- correct destructuring
    const x = t / maxT * (gcv.width - 2) + 1;
    const y = gcv.height - frac * (gcv.height - 2) - 1;
    i ? gtx.lineTo(x, y) : gtx.moveTo(x, y);
  });
  gtx.strokeStyle='#f33'; gtx.lineWidth=2; gtx.stroke();
  gtx.beginPath();gtx.moveTo(0,gcv.height/2);gtx.lineTo(gcv.width,gcv.height/2);
  gtx.strokeStyle='#bbb';gtx.lineWidth=1;gtx.stroke();
}

/* -------------------------------- start / reset */
$('go').onclick=()=>{
  run=false; t=0; nextSamp=0; graph=[]; maxT=30;
  populate(); run=true; last=performance.now();
};

/* -------------------------------- boot */
populate(); requestAnimationFrame(loop);
</script>
</body>
</html>
